<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rect = (x,y,r,b) => [[x,y],[r,y],[r,b],[x,b]];
const grid = (cols,rows) => Array.from({length:cols*rows},(_,i) => {
  const x=i%cols,y=Math.floor(i/cols);
  return rect(x/cols,y/rows,(x+1)/cols,(y+1)/rows);
});
const layouts = [
 ['tiled-grid','Tiled Grid',()=>[rect(0,0,.36,.36),rect(.36,0,1,.36),rect(0,.36,.58,.72),rect(.58,.36,1,.72),rect(0,.72,.33,1),rect(.33,.72,1,1)]],
 ['slash-panels','Slash Panels',()=>[[[0,0],[.35,0],[.16,1],[0,1]],[[.35,0],[.68,0],[.55,1],[.16,1]],[[.68,0],[1,0],[1,1],[.55,1]]]],
 ['hero-shards','Hero + 5 Shards',a=>{
   const x=a>1.3?.55:.62;
   const seam = y => [x+.06-.16*y/.72,y];
   const top=seam(0), upper=seam(.32), lower=seam(.55), bottom=seam(.72);
   return [
     [[0,0],top,bottom,[0,.84]],
     [top,[1,0],[1,.24],upper],
     [upper,[1,.24],[1,.52],lower],
     [lower,[1,.52],[1,.80],bottom],
     [[0,.84],bottom,[.40,1],[0,1]],
     [bottom,[1,.80],[1,1],[.40,1]]
   ];
 }],
 ['whole-cast','Whole-Cast Grid',()=>grid(3,3)],
 ['six-panel-hero','6-Panel Hero',()=>[rect(.25,0,.75,.67),rect(0,0,.25,.38),rect(.75,0,1,.40),rect(0,.38,.25,1),rect(.75,.40,1,1),rect(.25,.67,.75,1)]],
 ['comic-slash','Comic Slash',()=>[[[0,0],[.52,0],[.42,.38],[0,.51]],[[.52,0],[1,0],[1,.32],[.42,.38]],[[0,.51],[.42,.38],[.68,.65],[.30,1],[0,1]],[[.42,.38],[1,.32],[1,.71],[.68,.65]],[[.68,.65],[1,.71],[1,1],[.30,1]]]],
 ['billboard','Billboard',a=>{const y=a>1.3?.68:.73;return [rect(0,0,1,y),...Array.from({length:4},(_,i)=>rect(i/4,y,(i+1)/4,1))]}],
 ['split-diagonal','Split Diagonal',a=>a>1.3?[[[0,0],[.64,0],[.35,1],[0,1]],[[.64,0],[1,0],[1,1],[.35,1]]]:[[[0,0],[1,0],[1,.35],[0,.65]],[[0,.65],[1,.35],[1,1],[0,1]]]],
 ['film-strip','Film Strip',a=>grid(a>1.3?6:4,1)]
];
const grades = [
 ['sunset-punch','Sunset Punch',[25,13,44],[255,161,121],1.20],
 ['neon-coast','Neon Coast',[12,18,58],[255,128,217],1.35],
 ['vice-dawn','Vice Dawn',[42,29,75],[255,203,197],.92],
 ['golden-hour','Golden Hour',[51,29,34],[255,212,143],1.07],
 ['miami-heat','Miami Heat',[42,13,44],[255,118,83],1.34],
 ['poster-ink','Poster Ink',[26,20,44],[255,191,150],1.28],
 ['teal-noir','Teal Noir',[6,25,35],[169,234,212],.69],
 ['rose-dusk','Rose Dusk',[40,19,51],[250,169,208],.97]
];
const ratios = [['16:9',1920,1080],['4:5',1080,1350],['1:1',1080,1080]];
const fonts = ['Impact, "Arial Black", system-ui, sans-serif',' Georgia, "Times New Roman", serif','"Arial Black", system-ui, sans-serif','"Courier New", monospace'];
const treatments = [['#fff9dc','#ffc16a','#fa637a','#622643'],['#edfffa','#9effdd','#39c8c9','#183c5b'],['#fff4e8','#fcb5ee','#b48aff','#44246f'],['#ffffec','#f8ff9e','#a9dc52','#304324']];
const furniture = [
 ['title','Title lockup',[]],
 ['stars','Star rating',[['stars','Stars','range',1,5]]],
 ['review','Review quote',[['quote','Quote','text',78],['source','Source','text',32]]],
 ['seal','Round seal',[['seal','Seal text','text',24]]],
 ['heat','Heat pill',[['heat','Pill text','text',22]]],
 ['tags','Tags',[['tags','Comma-separated tags','text',72]]],
 ['palms','Palm silhouette band',[]],
 ['billing','Billing block',[['credits','Credits','text',130]]],
 ['rating','Rating box',[['rating','Symbol','text',3],['ratingLabel','Rating label','text',20]]],
 ['mark','Corner mark',[]]
];
const fresh = () => ({
 layout:'slash-panels',grade:'neon-coast',intensity:66,ratio:2,title:'NEON VICE',subtitle:'Neon Nights, No Curfew',
 font:0,treatment:0,outline:65,shadow:72,stars:5,quote:'“The coast has never looked this dangerous.”',
 source:'THE NIGHT EDITION',seal:'PRE-ORDER',heat:'HIGH HEAT',tags:'COASTAL NOIR, OPEN CITY',
 credits:'PALMLINE PICTURES PRESENTS  •  A CALDER BAY PRODUCTION  •  THE VICE COAST ANTHOLOGY',
 rating:'N',ratingLabel:'NIGHT CUT',visible:Object.fromEntries(furniture.map(([key])=>[key,true])),photos:[],panels:{}
});
const stateCopy = value => structuredClone(value);
let state = fresh();
const images = new Map();
const photoId = () => Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const path = (ctx, points) => {
 ctx.beginPath();
 points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.closePath();
};
function bounds(points) {
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const x=Math.min(...xs),y=Math.min(...ys);
 return [x,y,Math.max(...xs)-x,Math.max(...ys)-y];
}
function gradient(ctx,x,y,r,b,stops) {
 const g=ctx.createLinearGradient(x,y,r,b);
 stops.forEach(([position,color])=>g.addColorStop(position,color));
 return g;
}
function palm(ctx,x,y,s,lean,color) {
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;
 path(ctx,[[0,0],[5,0],[lean+3,-51],[lean-1,-52],[0,0]]);ctx.fill();
 ctx.translate(lean,-52);
 for(const [angle,length,depth] of [[-2.8,28,7],[-2.32,24,8],[-1.67,23,7],[-.89,27,9],[-.25,30,8],[.28,24,10],[.83,19,8],[2.5,19,9]]){
   ctx.save();ctx.rotate(angle);
   ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(length*.52,-depth*1.5,length,depth*.1);
   for(let i=4;i>=1;i--)ctx.lineTo(length*i/5,i%2?depth*.33:depth*.03);
   ctx.lineTo(0,3);ctx.fill();ctx.restore();
 }
 ctx.restore();
}
function makeScene(i) {
 const c=document.createElement('canvas');c.width=900;c.height=760;
 const g=c.getContext('2d'), W=c.width,H=c.height;
 const skies=[['#27254e','#ad4d83','#ff9770'],['#132951','#31698a','#f8839f'],['#2b194e','#cb5578','#ffd491'],['#2b305d','#705f9e','#ffad81']];
 const [top,mid,end]=skies[i%4], sx=250+(i*103)%410, sy=326+(i%3)*29;
 g.fillStyle=gradient(g,0,0,0,H,[[0,top],[.53,mid],[.72,end],[1,'#2c274d']]);g.fillRect(0,0,W,H);
 const glow=g.createRadialGradient(sx,sy,5,sx,sy,245);
 glow.addColorStop(0,'#ffe79abc');glow.addColorStop(1,'#ff838100');g.fillStyle=glow;g.fillRect(0,0,W,H);
 g.save();g.beginPath();g.arc(sx,sy,113,0,2*Math.PI);g.clip();
 g.fillStyle=gradient(g,0,sy-113,0,sy+114,[[0,'#fff3bf'],[1,'#ff876f']]);g.fillRect(sx-114,sy-114,228,228);
 g.fillStyle='#e87a8f';
 for(let j=0;j<7;j++)g.fillRect(sx-115,sy+15+j*15,230,2+j);
 g.restore();
 let seed=173+i*231;
 const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
 for(let j=0;j<52;j++){
   g.fillStyle=j%3?'#ffd2ad28':'#ffe8dc48';
   g.fillRect(random()*W,random()*H*.57,5+random()*95,1+random()*2);
 }
 for(let layer=0;layer<2;layer++){
   for(let x=-12;x<W;){
     const w=11+random()*49,h=12+random()**2*131,y=H*(.64+layer*.055);
     g.fillStyle=layer?'#292340':'#573450';g.fillRect(x,y-h,w,y+h);
     if(random()>.75)g.fillRect(x+w*.5,y-h-19,2,19);
     for(let fx=x+5;fx<x+w-3;fx+=7)for(let fy=y-h+8;fy<y-3;fy+=8){
       if(random()>.68){g.fillStyle=random()>.4?'#ffc573a8':'#e98bab9e';g.fillRect(fx,fy,2,2);}
     }
     x+=w+3;
   }
 }
 g.fillStyle=gradient(g,0,H*.70,0,H,[[0,'#62415f'],[.3,'#373154'],[1,'#211c37']]);g.fillRect(0,H*.70,W,H*.30);
 for(let j=0;j<180;j++){
   const y=H*.705+random()*H*.26;
   g.fillStyle=j%3===0?'#ffb89755':'#b985ab30';g.fillRect(random()*W,y,3+random()*90,1+random()*2);
 }
 g.fillStyle='#21172d';path(g,[[0,H*.85],[W*.28,H*.91],[W*.63,H*.94],[W,H*.86],[W,H],[0,H]]);g.fill();
 [[.07,.94,6.7,20],[.25,.89,3.2,-7],[.80,.92,5.4,-14],[.97,.96,7.4,-16]].forEach(([x,y,s,l])=>palm(g,x*W,y*H,s,l,'#1b162b'));
 return c;
}
const scenes=Array.from({length:6},(_,i)=>makeScene(i));
const positions = [[.5,.38],[.29,.39],[.69,.31],[.47,.67],[.77,.64],[.32,.66],[.58,.27],[.36,.55],[.64,.51]];
function panelState(project,i) {
 return project.panels[project.layout]?.[i] ?? {source:project.layout==='slash-panels'?[1,2,0][i]:i,x:0,y:0,zoom:1,flip:false};
}
function panelPoints(project,w,h) {
 const inset=Math.min(w,h)*.018, top=inset, bottom=h-inset;
 const layout=layouts.find(([id])=>id===project.layout)??layouts[0];
 return layout[2](w/h).map(p=>p.map(([x,y])=>[inset+x*(w-2*inset),top+y*(bottom-top)]));
}
function paintPhoto(ctx,project,i,p) {
 const t=panelState(project,i);
 const id=project.photos[t.source%project.photos.length];
 const photo=images.get(id);
 const source=photo?.image??scenes[t.source%scenes.length];
 const [x,y,w,h]=bounds(p);
 const repeated=project.photos.length<=2;
 const [fx,fy]=photo?.focus??(repeated?positions[i%positions.length]:positions[0]);
 const sw=source.width,sh=source.height;
 const variation=repeated&&i>0?1.08+(i%3)*.09:1;
 const scale=Math.max(w/sw,h/sh)*t.zoom*variation;
 const dw=sw*scale,dh=sh*scale;
 const left=x+clamp(w*.5-(t.flip?1-fx:fx)*dw+t.x*w,w-dw,0);
 const top=y+clamp(h*.46-fy*dh+t.y*h,h-dh,0);
 ctx.save();path(ctx,p);ctx.clip();
 ctx.translate(left+(t.flip?dw:0),top);ctx.scale(t.flip?-1:1,1);
 ctx.drawImage(source,0,0,dw,dh);ctx.restore();
 return Boolean(photo)||!project.photos.length;
}
function gradePixels(ctx,w,h,id,intensity) {
 if(!intensity)return;
 const [, , low, high, sat]=grades.find(g=>g[0]===id)??grades[0];
 const amount=intensity/100, ink=id==='poster-ink';
 const image=ctx.getImageData(0,0,w,h), d=image.data;
 const luma=ink?new Uint8Array(w*h):null;
 if(ink)for(let p=0,j=0;p<d.length;p+=4,j++)luma[j]=(.25*d[p]+.60*d[p+1]+.15*d[p+2]);
 for(let p=0,j=0;p<d.length;p+=4,j++){
   const r=d[p],g=d[p+1],b=d[p+2],y=.25*r+.60*g+.15*b;
   const skin=ink&&r>55&&r>=g*1.07&&g>=b*.98&&r-b>12&&r-g<105&&g-b<72;
   const a=amount*(skin?.10:1);
   const tone=clamp((y/255-.5)*1.12+.5,0,1);
   const edge=ink&&!skin&&j%w<w-2&&j+w*2<luma.length
     ?clamp((Math.max(Math.abs(luma[j]-luma[j+2]),Math.abs(luma[j]-luma[j+w*2]))-13)/70,0,.65):0;
   for(let c=0;c<3;c++){
     const original=d[p+c];
     let color=y+(original-y)*sat;
     color=(color-128)*1.09+128;
     if(ink&&!skin)color=Math.round(color/27)*27;
     color=(color*.77+(low[c]+(high[c]-low[c])*tone)*.23)*(1-edge);
     d[p+c]=original+(color-original)*a;
   }
 }
 ctx.putImageData(image,0,0);
}
function round(ctx,x,y,w,h,r,fill,stroke) {
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);
 if(fill){ctx.fillStyle=fill;ctx.fill();}
 if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}
function write(ctx,audit,text,x,y,max,size,style,color,align='left') {
 if(!text)return;
 ctx.font=style.replace('@',size+'px');ctx.textAlign=align;ctx.textBaseline='alphabetic';

 if(!gesture||!pointers.has(e.pointerId))return;
 const point=locate(e);pointers.set(e.pointerId,point);
 if(gesture.swap||gesture.held)return;
 const [, ,w,h]=bounds(displayPolys[selected]);
 if(gesture.pinch&&pointers.size===2){
   const [a,b]=pointers.values(),distance=Math.hypot(a[0]-b[0],a[1]-b[1]);
   editablePanel(state,selected).zoom=clamp(gesture.pinchZoom*distance/gesture.pinch,1,5);
 }else{
   const dx=point[0]-gesture.start[0],dy=point[1]-gesture.start[1];
   if(!gesture.changed&&Math.hypot(dx,dy)<3)return;
   const t=editablePanel(state,selected);
   t.x=clamp(gesture.initial.x+dx/w,-4,4);t.y=clamp(gesture.initial.y+dy/h,-4,4);
 }
 gesture.changed=true;requestPaint();
});
function endGesture(e){
 if(!gesture||!pointers.delete(e.pointerId))return;
 if(pointers.size){gesture.held=true;return;}
 const {swap,previous,changed}=gesture;gesture=null;
 if(swap&&e.type==='pointerup'){
   const end=hit(locate(e));if(end>=0)swapPanels(selected,end);
 }else if(changed){remember(previous);notify('Panel crop adjusted.');}
}
preview.addEventListener('pointerup',endGesture);
preview.addEventListener('pointercancel',endGesture);
preview.addEventListener('wheel',e=>{
 const i=hit(locate(e));if(i<0)return;
 e.preventDefault();selected=i;selectionVisible=true;
 if(!wheelStart)wheelStart=stateCopy(state);
 const t=editablePanel(state,i);
 t.zoom=clamp(t.zoom*Math.exp(-clamp(e.deltaY,-100,100)*.0025),1,5);
 requestPaint();clearTimeout(wheelTimer);wheelTimer=setTimeout(finishWheel,180);
},{passive:false});
preview.addEventListener('keydown',e=>{
 if(e.key==='+'||e.key==='='){e.preventDefault();zoomBy(1.18);}
 if(e.key==='-'){e.preventDefault();zoomBy(1/1.18);}
 if(e.key.startsWith('Arrow')){
   e.preventDefault();selectionVisible=true;
   selected=(selected+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+displayPolys.length)%displayPolys.length;
   drawSelection(true);
 }
});
function surprise(){
 const alternate=(current,values)=>{
   const available=values.filter(value=>value!==current);
   return available[Math.floor(Math.random()*available.length)];
 };
 selected=0;
 change(p=>{
   p.layout=alternate(p.layout,layouts.map(l=>l[0]));
   p.grade=alternate(p.grade,grades.map(g=>g[0]));
   p.treatment=alternate(p.treatment,treatments.map((_,i)=>i));
   p.font=alternate(p.font,fonts.map((_,i)=>i));
 },'New layout, palette and title treatment.');
}
document.addEventListener('keydown',e=>{
 if(shot==='cover')return;
 const key=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(e.target.matches('input,textarea,select,[contenteditable]')||e.altKey)return;
 if(mod&&key==='z'){e.preventDefault();finishWheel();travel(!e.shiftKey);return;}
 if(mod&&key==='y'){e.preventDefault();finishWheel();travel(false);return;}
 if(mod)return;
 if(/^[1-9]$/.test(key))setLayout(layouts[Number(key)-1][0]);
 if(key==='s')surprise();
 if(key==='e')exportSizes([state.ratio]);
 if(key==='g')change(p=>p.grade=grades[(grades.findIndex(g=>g[0]===p.grade)+1)%grades.length][0],'Palette applied.');
});
function canvasCopy(image,max){
 const factor=Math.min(1,max/Math.max(image.width,image.height));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(image.width*factor));
 canvas.height=Math.max(1,Math.round(image.height*factor));
 const ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';
 ctx.drawImage(image,0,0,canvas.width,canvas.height);
 return canvas;
}
async function detectFocus(image){
 if(!('FaceDetector' in window))return null;
 try{
   const faces=await new FaceDetector({maxDetectedFaces:3,fastMode:true}).detect(image);
   if(!faces.length)return null;
   const best=faces.map(f=>f.boundingBox).sort((a,b)=>b.width*b.height-a.width*a.height)[0];
   return [(best.x+best.width/2)/image.width,(best.y+best.height*.52)/image.height];
 }catch{return null;}
}
async function decode(url){
 const image=new Image();
 image.src=url;await image.decode();
 return image;
}
async function register(id,image,saved=null,focus=undefined){
 const sized=canvasCopy(image,2048);
 const crop=focus===undefined?await detectFocus(sized):focus;
 const file=saved??canvasCopy(sized,1150).toDataURL('image/webp',.76);
 images.set(id,{image:sized,saved:file,focus:crop});
}
async function loadSamples(names,record){
 if(busy)return;
 busy=true;
 const revision=photoRevision;
 try{
   await Promise.all(names.map(async name=>{
     if(!images.has(name)){
       const url='samples/'+name+'.jpg';
       const response=await fetch(url);
       if(!response.ok)throw Error('Sample could not be fetched');
       const blobURL=URL.createObjectURL(await response.blob());
       try{
         const image=await decode(blobURL);
         await register(name,image,url,null);
       }finally{URL.revokeObjectURL(blobURL);}
     }
   }));
   if(record&&revision!==photoRevision)return;
   if(record)change(p=>{p.photos=[...names];p.panels={};},'Demo photos loaded.');
   else state.photos=[...names];
 }catch{notify('The demo photos could not be read.',true);}
 finally{busy=false;}
}
async function addFiles(files){
 if(!files.length||busy)return;
 busy=true;
 const added=[],skipped=[],revision=photoRevision;
 try{
   const remaining=9-state.photos.length;
   for(const file of files){
     if(added.length>=remaining){skipped.push('The project holds up to nine photos.');break;}
     if(/\.(heic|heif)$/i.test(file.name)||/hei[cf]/i.test(file.type)){
       skipped.push('HEIC is unsupported. Try JPG, PNG or WebP.');continue;
     }
     if(file.type&&!file.type.startsWith('image/')){
       skipped.push('Choose an image file such as JPG, PNG or WebP.');continue;
     }
     const url=URL.createObjectURL(file);
     try{
       const decoded=await decode(url),id=photoId();
       await register(id,decoded);
       added.push(id);
     }catch{skipped.push('This image could not be opened. Try JPG, PNG or WebP.');}
     finally{URL.revokeObjectURL(url);}
   }
   if(revision!==photoRevision)return;
   if(added.length)change(p=>p.photos.push(...added.slice(0,9-p.photos.length)));
   notify([added.length?added.length+' photo'+(added.length===1?'':'s')+' added.':'',...new Set(skipped)].filter(Boolean).join(' '),Boolean(skipped.length));
 }finally{busy=false;}
}
async function restore(){
 try{
   const stored=JSON.parse(localStorage.getItem(storageKey)??'null');
   if(!stored?.state||!Array.isArray(stored.files))return;
   await Promise.all(stored.files.map(async ([id,src,focus])=>register(id,await decode(src),src,focus)));
   state={...fresh(),...stored.state};
   state.photos=state.photos.filter(id=>images.has(id));
 }catch{notify('This browser could not restore a local project.',true);}
}
let exporting=false;
async function exportSizes(indices){
 if(exporting)return;
 exporting=true;
 $('exportAll').disabled=$('export').disabled=true;
 const project=stateCopy(state),target=document.createElement('canvas');
 try{
   notify('Rendering '+(indices.length===1?'PNG…':'three PNGs…'));
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   for(const index of indices){
     const [,w,h]=ratios[index];
     render(target,w,h,project);
     const blob=await new Promise(resolve=>target.toBlob(resolve,'image/png'));
     if(!blob)throw Error('Canvas encoding failed');
     const url=URL.createObjectURL(blob),a=document.createElement('a');
     a.href=url;a.download='palmline-'+w+'x'+h+'.png';document.body.append(a);a.click();a.remove();
     setTimeout(()=>URL.revokeObjectURL(url),30000);
   }
   notify(indices.length===1?'PNG download started.':'All three PNGs sent to your downloads.');
 }catch{notify('The poster could not be exported. Please try again.',true);}
 finally{exporting=false;$('exportAll').disabled=$('export').disabled=false;}
}
async function start(){
 wire();
 notify('Ready · edits stay on this device.');
 if(shot==='editor'||shot==='cover'){
   const name=params.get('photo');
   const titles=params.get('caption'), layout=params.get('layout'), grade=params.get('grade');
   if(titles!==null)state.title=titles.slice(0,36);
   if(layouts.some(l=>l[0]===layout))state.layout=layout;
   if(grades.some(g=>g[0]===grade))state.grade=grade;
   await loadSamples(samples.includes(name)?[name]:samples,false);
  }else{
   await restore();
   const name=params.get('photo');
   if(samples.includes(name)||!state.photos.length)await loadSamples(samples.includes(name)?[name]:samples,false);
 }
 const intensity=params.get('intensity');
 if(intensity!==null&&intensity.trim()!==''&&Number.isFinite(Number(intensity))&&Number(intensity)>=0&&Number(intensity)<=100)state.intensity=Number(intensity);
 if(shot==='cover'){
   document.body.classList.add('shot-cover');
   const cover=$('cover');
   cover.hidden=false;
   const draw=()=>render(cover,Math.round(innerWidth*devicePixelRatio),Math.round(innerHeight*devicePixelRatio));
   window.addEventListener('resize',draw);
   draw();
 }else{
   refresh();
   if(shot==='editor')notify('Demo photos loaded · drag a panel to adjust its crop.');
 }
 requestAnimationFrame(()=>requestAnimationFrame(()=>{window.__shotReady=true;}));
}
start();

</script>
